<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="knitLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCFAF5" />
      <stop offset="60%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#E2D7C5" />
    </radialGradient>
    <pattern id="loopnetPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 0 20 10 T 40 10" fill="none" stroke="#D3C7B5" stroke-width="2.5" />
      <path d="M 0 30 Q 10 20 20 30 T 40 30" fill="none" stroke="#D3C7B5" stroke-width="2.5" />
      <circle cx="20" cy="20" r="3" fill="#E8DECFA" />
      <path d="M 10 0 Q 0 10 10 20 T 10 40" fill="none" stroke="#CABFB0" stroke-width="1" opacity="0.6" />
      <path d="M 30 0 Q 20 10 30 20 T 30 40" fill="none" stroke="#CABFB0" stroke-width="1" opacity="0.6" />
    </pattern>
  </defs>

  <rect width="1000" height="1200" fill="url(#knitLight)" />
  <rect width="1000" height="1200" fill="url(#loopnetPattern)" opacity="0.85" />

  <text x="80" y="80" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.25em" fill="#8C887E">MATERIAL CLOSE-UP // TEXTILE INSPECTION</text>
  <text x="920" y="80" text-anchor="end" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.15em" fill="#722F37">LOOPNET KNIT ARCHITECTURE</text>

  <!-- Magnification Loupe Ring In Center -->
  <g transform="translate(500, 600)">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#1C1B19" stroke-width="4" />
    <circle cx="0" cy="0" r="270" fill="none" stroke="#D4C8B5" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Crosshairs -->
    <line x1="-300" y1="0" x2="-250" y2="0" stroke="#722F37" stroke-width="2" />
    <line x1="250" y1="0" x2="300" y2="0" stroke="#722F37" stroke-width="2" />
    <line x1="0" y1="-300" x2="0" y2="-250" stroke="#722F37" stroke-width="2" />
    <line x1="0" y1="250" x2="0" y2="300" stroke="#722F37" stroke-width="2" />

    <!-- Technical Callout Inside Loupe -->
    <rect x="-140" y="-30" width="280" height="60" fill="#1C1B19" rx="4" />
    <text x="0" y="-8" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="0.2em" fill="#FCFAF5">PREMIUM LOOPNET</text>
    <text x="0" y="14" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="500" letter-spacing="0.15em" fill="#D6CDBF">DURABLE // BREATHABLE // STRUCTURED</text>
  </g>

  <g transform="translate(80, 1100)">
    <text x="0" y="0" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.1em" fill="#1C1B19">TACTILE PROFILE: ULTRA-SOFT INTERIOR WITH STRUCTURED EXTERIOR</text>
    <text x="0" y="24" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="500" fill="#736E64">DESIGNED FOR NATURAL DRAPE WITHOUT LOSING BOXY FORM</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSleeve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F2" />
      <stop offset="100%" stop-color="#EBE6DC" />
    </linearGradient>
    <filter id="threadGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#581825" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#bgSleeve)" />

  <!-- Sleeve Diagonal Base Texture -->
  <path d="M 100 0 L 900 1200 L 400 1200 L 0 600 Z" fill="#F4EFE6" stroke="#DED5C5" stroke-width="2" />
  
  <text x="80" y="80" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.25em" fill="#8C887E">MACRO VIEW // SLEEVE CRAFTSMANSHIP</text>
  <text x="920" y="80" text-anchor="end" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.15em" fill="#722F37">BURGUNDY FLORAL EMBROIDERY</text>

  <!-- Large Macro Floral Branch in Rich Burgundy -->
  <g transform="translate(350, 250)" filter="url(#threadGlow)">
    <!-- Branch stem -->
    <path d="M 0 0 C 120 150 50 300 180 500 C 260 620 200 750 300 850" fill="none" stroke="#581825" stroke-width="12" stroke-linecap="round" />
    <path d="M 0 0 C 120 150 50 300 180 500 C 260 620 200 750 300 850" fill="none" stroke="#722F37" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 4" />

    <!-- Bloom 1 -->
    <g transform="translate(80, 180)">
      <circle cx="0" cy="0" r="55" fill="#722F37" />
      <circle cx="-25" cy="-20" r="40" fill="#581825" />
      <circle cx="25" cy="-15" r="42" fill="#8C3742" />
      <circle cx="0" cy="25" r="45" fill="#722F37" />
      <circle cx="0" cy="0" r="18" fill="#FDFBF7" />
      <circle cx="0" cy="0" r="8" fill="#581825" />
    </g>

    <!-- Bloom 2 -->
    <g transform="translate(180, 480)">
      <circle cx="0" cy="0" r="70" fill="#581825" />
      <circle cx="-35" cy="-25" r="52" fill="#722F37" />
      <circle cx="35" cy="-20" r="50" fill="#8C3742" />
      <circle cx="0" cy="35" r="54" fill="#722F37" />
      <circle cx="0" cy="0" r="22" fill="#FDFBF7" />
      <circle cx="0" cy="0" r="10" fill="#722F37" />
    </g>

    <!-- Bloom 3 -->
    <g transform="translate(250, 780)">
      <circle cx="0" cy="0" r="50" fill="#722F37" />
      <circle cx="-20" cy="-18" r="38" fill="#581825" />
      <circle cx="22" cy="-15" r="36" fill="#8C3742" />
      <circle cx="0" cy="0" r="15" fill="#FDFBF7" />
    </g>

    <!-- Detailed Leaves -->
    <path d="M 20 100 Q -80 70 -50 140 C -10 130 10 115 20 100 Z" fill="#581825" />
    <path d="M 120 320 Q 220 300 210 380 C 160 370 135 340 120 320 Z" fill="#722F37" />
    <path d="M 150 400 Q 60 410 70 480 C 110 460 140 430 150 400 Z" fill="#581825" />
    <path d="M 220 620 Q 320 600 310 680 C 260 670 235 640 220 620 Z" fill="#8C3742" />
  </g>

  <!-- Technical Overlay -->
  <g transform="translate(80, 1100)">
    <text x="0" y="0" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.1em" fill="#1C1B19">THREAD SPECIFICATION: 100% VISCOSE EMBROIDERY FILAMENT</text>
    <text x="0" y="24" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="500" fill="#736E64">HIGH-DENSITY MULTI-LAYER TACTILE TEXTURE // COLOR CODE: BURGUNDY #722F37</text>
  </g>
</svg>
